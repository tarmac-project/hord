version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(core)
  - package-ecosystem: gomod
    directory: /cache
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(cache)
  - package-ecosystem: gomod
    directory: /drivers/bbolt
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(drivers/bbolt)
  - package-ecosystem: gomod
    directory: /drivers/cassandra
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(drivers/cassandra)
  - package-ecosystem: gomod
    directory: /drivers/hashmap
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(drivers/hashmap)
  - package-ecosystem: gomod
    directory: /drivers/mock
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(drivers/mock)
  - package-ecosystem: gomod
    directory: /drivers/nats
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(drivers/nats)
  - package-ecosystem: gomod
    directory: /drivers/redis
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(drivers/redis)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    directory: /.github/commitlint
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      commitlint:
        patterns:
          - '*'
